name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Scan with SonarCloud
        uses: highbyte/sonarscan-dotnet@8642efb8793ae4a89bd1e6cdf0a1aef1e582f9bb # v2.5.1
        with:
          sonarProjectKey: highbyte_wrighty
          sonarProjectName: wrighty
          sonarOrganization: highbyte
          dotnetPreBuildCmd: npm run test:coverage && test -s /github/workspace/javascript-coverage.lcov
          dotnetTestArguments: >-
            --logger trx
            --collect:"XPlat Code Coverage"
            --
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          # sonar.exclusions drops scripts/** from analysis. Everything there is developer tooling
          # — walkthroughs, fixtures, prototype probes — rather than shipped product code, and the
          # shell rules were being applied only to newly added scripts while the existing ones went
          # unmeasured. One consistent rule for all of them beats a bar that only new scripts have
          # to clear. Their behaviour is still exercised: the scripts run in CI and locally, and
          # shellcheck directives stay in the sources.
          sonarBeginArguments: >-
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
            -d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx"
            /d:sonar.javascript.lcov.reportPaths="/github/workspace/javascript-coverage.lcov"
            /d:sonar.coverage.exclusions="tests/PackageManagerManifestTests/**/*.py"
            /d:sonar.exclusions="scripts/**"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
