name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Wrighty.slnx

      - name: Build
        run: dotnet build Wrighty.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test Wrighty.slnx --configuration Release --no-build

      - name: Run package-manifest tests
        run: python3 -m unittest discover -s tests/PackageManagerManifestTests -p 'test_*.py'
